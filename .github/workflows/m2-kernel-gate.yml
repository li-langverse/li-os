name: M2 kernel gate

on:
  push:
    branches: [cursor/lios-kernel-m2]
    paths:
      - "scripts/**"
      - "docs/**"
      - "data/lios-kernel-loop/**"
      - ".github/workflows/m2-kernel-gate.yml"
  pull_request:
    branches: [main, cursor/lios-kernel-m1, cursor/lios-kernel-m2]
    paths:
      - "scripts/**"
      - "docs/**"
      - "data/lios-kernel-loop/**"
      - ".github/workflows/m2-kernel-gate.yml"
  workflow_dispatch:

concurrency:
  group: m2-kernel-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  m2-gate-check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: M2 gate script check (dry run)
        run: |
          chmod +x scripts/gates/*.sh scripts/ci/m2-kernel-smoke.sh scripts/dev-vm.sh
          bash scripts/ci/m2-kernel-smoke.sh --check

  m2-gate-full:
    runs-on: ubuntu-24.04
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - name: Checkout lic (kernel compiler + smoke-kernel stubs)
        uses: actions/checkout@v4
        with:
          repository: li-langverse/lic
          path: lic
          ref: cursor/lios-kernel-m2

      - name: Checkout lik (virtio + MM kernels)
        uses: actions/checkout@v4
        with:
          repository: li-langverse/lik
          path: lik
          ref: cursor/lios-kernel-m2

      - name: Install LLVM 22 and QEMU
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            cmake ninja-build clang-22 llvm-22-dev lld-22 \
            binutils zlib1g-dev libzstd-dev python3 qemu-system-x86

      - name: Build lic (freestanding kernel target)
        working-directory: lic
        env:
          LLVM_DIR: /usr/lib/llvm-22/lib/cmake/llvm
          CC: clang-22
          CXX: clang++-22
        run: |
          chmod +x scripts/build-kernel-lic.sh
          ./scripts/build-kernel-lic.sh

      - name: Run M2 completion gates
        env:
          LIC_ROOT: ${{ github.workspace }}/lic
          LIK_ROOT: ${{ github.workspace }}/lik
        run: |
          chmod +x scripts/gates/*.sh scripts/ci/*.sh lik/scripts/*.sh scripts/dev-vm.sh
          bash scripts/gates/m2-completion-gate.sh
